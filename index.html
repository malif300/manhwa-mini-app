<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manhwa Reader</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #17212b; color: white; margin: 0; padding: 0; overflow: hidden; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    
    /* Skeleton loading animation */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    .skeleton {
      background-color: #242f3d;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="h-screen flex flex-col">
  
  <!-- Search Bar -->
  <div class="p-4 sticky top-0 bg-[#17212b] z-10 shadow-md">
    <div class="relative">
      <input type="text" id="searchInput" placeholder="Search Manhwa..." 
             class="w-full bg-[#242f3d] text-white p-3 pl-10 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all"
             oninput="filterManga()">
      <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
    </div>
  </div>

  <!-- Loading State -->
  <div id="loading" class="grid grid-cols-2 gap-4 p-4 overflow-y-auto" style="flex: 1;">
    <!-- Skeleton Cards -->
    <div class="skeleton h-64 rounded-xl"></div>
    <div class="skeleton h-64 rounded-xl"></div>
    <div class="skeleton h-64 rounded-xl"></div>
    <div class="skeleton h-64 rounded-xl"></div>
  </div>

  <!-- Manga Grid -->
  <div id="mangaGrid" class="hidden grid-cols-2 gap-4 p-4 overflow-y-auto" style="flex: 1;">
    <!-- Cards injected here -->
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.setHeaderColor('#17212b');

    const RAILWAY_URL = 'https://manhwa-opehh-production.up.railway.app';

    // Auth
    fetch(`${RAILWAY_URL}/api/auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData })
    }).catch(e => console.log("Auth skipped"));

    let allManga = [];

    // Fetch Data
    fetch(`${RAILWAY_URL}/api/popular`)
      .then(res => {
         if (!res.ok) throw new Error("Server error");
         return res.json();
      })
      .then(data => {
        allManga = data;
        renderManga(allManga);
        
        // Hide loading skeletons, show grid
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('mangaGrid').classList.remove('hidden');
        document.getElementById('mangaGrid').classList.add('grid');
      })
      .catch(err => {
        console.error("Fetch Error:", err);
        document.getElementById('loading').innerHTML = `
          <p class="col-span-2 text-center text-red-400 mt-10">
            Failed to connect to Railway backend.<br>Check if bot is online.
          </p>
        `;
      });

    function renderManga(mangaList) {
      const grid = document.getElementById('mangaGrid');
      grid.innerHTML = '';
      mangaList.forEach(manga => {
        const card = document.createElement('div');
        card.className = "bg-[#242f3d] rounded-xl overflow-hidden cursor-pointer active:scale-95 transition-all shadow-lg border border-[#2d3a4a]";
        card.onclick = () => {
          tg.sendData(JSON.stringify({ mangaId: manga.id }));
          tg.close();
        };
        
        card.innerHTML = `
          <div class="relative aspect-[3/4] overflow-hidden">
            <img src="${manga.thumbnailUrl}" 
                 alt="${manga.title}"
                 class="w-full h-full object-cover"
                 loading="lazy"
                 onerror="this.onerror=null; this.src='https://via.placeholder.com/300x400/242f3d/ffffff?text=No+Cover';" />
            <div class="absolute inset-0 bg-gradient-to-t from-[#17212b] via-transparent to-transparent opacity-60"></div>
          </div>
          <div class="p-3">
            <p class="text-sm font-semibold text-white truncate leading-tight">${manga.title}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterManga() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allManga.filter(m => m.title.toLowerCase().includes(query));
      renderManga(filtered);
    }
  </script>
</body>
</html>

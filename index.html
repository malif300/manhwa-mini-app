<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Test</title>
</head>
<body style="background-color: #ff0000; color: white; text-align: center; padding-top: 50px; font-family: Arial, sans-serif;">
  <h1>TELEGRAM CACHE BROKEN!</h1>
  <p>If you see this RED screen, the cache is gone and the new code works.</p>
  <h2>Hello, <span id="name">User</span>!</h2>
  
  <button onclick="window.Telegram.WebApp.close()" style="padding: 10px 20px; font-size: 18px; margin-top: 20px;">
    Close App
  </button>

  <script>
    // Basic Telegram init
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    // Show the user's name
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('name').textContent = tg.initDataUnsafe.user.first_name;
    }
  </script>
</body>
</html>
